# Docker Compose para Lucid Vision Cameras - ROS2 Humble
# Projeto: Carro Autônomo
#
# USO:
#   Build:    docker compose build
#   Subir:    docker compose up -d
#   Logs:     docker compose logs -f
#   Shell:    docker compose exec camera_dev bash
#   Parar:    docker compose down
#
# ESCALABILIDADE:
#   Para adicionar mais câmeras, copie o serviço camera_X e ajuste:
#   - container_name
#   - CAMERA_SERIAL
#   - CAMERA_TOPIC
#   - Porta de visualização (se usar web)

services:
  # ============================================================================
  # CONTAINER DE DESENVOLVIMENTO
  # Use este para testes, debugging e desenvolvimento
  # ============================================================================
  camera_dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lucid_camera_dev
    volumes:
      # Workspace ROS2 (persistente para desenvolvimento)
      - ./ros2_ws:/arena_camera_ros2/ros2_ws
      # Scripts auxiliares
      - ./scripts:/arena_camera_ros2/scripts
      # Launch files
      - ./launch:/arena_camera_ros2/launch
      # Configurações
      - ./config:/arena_camera_ros2/config
      # Pasta para bags gravados
      - ./bags:/arena_camera_ros2/bags
      # X11 para visualização
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      # Variáveis para identificação da câmera (opcional)
      - CAMERA_SERIAL=
      - CAMERA_TOPIC=/arena_camera_node/images
    # Modo host para acesso direto à rede (necessário para GigE Vision)
    network_mode: host
    # Privilegiado para acesso ao hardware
    privileged: true
    # IPC compartilhado para melhor performance
    ipc: host
    stdin_open: true
    tty: true
    # Restart automático em caso de falha
    restart: unless-stopped
    command: bash

