# Docker Compose — Lucid Vision Cameras / ROS2 Humble
#
# Usage:
#   Build:   docker compose build
#   Start:   docker compose up -d camera_dev
#   Shell:   docker compose exec camera_dev bash
#   Logs:    docker compose logs -f
#   Stop:    docker compose down
#
# Before starting: generate FastDDS profile for this machine:
#   ./config/setup_fastdds.sh subscriber <interface>   (e.g., eth0, wlan0)
# Then allow X11 access for graphical viewers:
#   xhost +local:docker

services:
  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: fastdds_server
    network_mode: "host" # Mandatory to see Netbird IP
    command: >
      -i 0
    restart: unless-stopped
  camera_dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        arenasdk_root_on_host: ${ARENASDK_ROOT_ON_HOST}
        arenasdk_parent: ${ARENASDK_PARENT}
        arena_api_root_on_host: ${ARENA_API_ROOT_ON_HOST}
        arena_api_parent: ${ARENA_API_PARENT}
    container_name: lucid_camera_dev
    depends_on:
      - discovery-server
    env_file:
      - .env
    environment:
      # Seriais (override cameras.yaml); .env já carregado via env_file
      - CAMERA_1_SERIAL=${CAMERA_1_SERIAL:-}
      - CAMERA_2_SERIAL=${CAMERA_2_SERIAL:-}
    volumes:
      # Monta o src (launch, config e código-fonte ficam aqui)
      - ./ros2_ws/src:/arena_camera_ros2/ros2_ws/src
      # Configurações FastDDS
      - ./config:/arena_camera_ros2/config
      # Pasta para bags gravados
      - ./bags:/arena_camera_ros2/bags
      # X11 para visualização
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Scripts do host
      - ./scripts:/arena_camera_ros2/scripts
    # Modo host para acesso direto à rede (necessário para GigE Vision)
    network_mode: "host"
    # Privilegiado para acesso ao hardware
    privileged: true
    # IPC compartilhado para melhor performance
    ipc: host
    stdin_open: true
    tty: true
    # Restart automático em caso de falha
    restart: unless-stopped
    command: >
      bash -lc "source /opt/ros/humble/setup.bash && \
      colcon build --symlink-install && \
      source /arena_camera_ros2/ros2_ws/install/setup.bash && \
      ros2 launch arena_camera_node camera_pipeline.launch.py \
      config_file:=/arena_camera_ros2/ros2_ws/src/arena_camera_node/config/cameras.yaml"
