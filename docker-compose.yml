# Docker Compose — Lucid Vision Cameras / ROS2 Humble
#
# Usage:
#   Build:   docker compose build
#   Start:   docker compose up -d
#   Shell:   docker compose exec camera_dev bash
#   Logs:    docker compose logs -f
#   Stop:    docker compose down
#
# Comunicação remota (VPN):
#   O Discovery Server roda no host e é acessível via Netbird.
#   O notebook receptor conecta com:
#     export ROS_DISCOVERY_SERVER=100.107.134.30:11811
#     export FASTRTPS_DEFAULT_PROFILES_FILE=<path>/fastdds_subscriber.xml
#     export RMW_IMPLEMENTATION=rmw_fastrtps_cpp

services:
  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: fastdds_server
    network_mode: "host"
    environment:
      - FASTRTPS_DEFAULT_PROFILES_FILE=/config/fastdds_discovery_server.xml
    volumes:
      - ./config:/config:ro
    command: >
      -i 0 -l 100.107.134.30
    restart: unless-stopped

  camera_dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        arenasdk_root_on_host: ${ARENASDK_ROOT_ON_HOST:-./resources/ArenaSDK/linux64}
        arenasdk_parent: ${ARENASDK_PARENT:-/}
        arena_api_root_on_host: ${ARENA_API_ROOT_ON_HOST:-./resources/arena_api}
        arena_api_parent: ${ARENA_API_PARENT:-/arena_api}
    container_name: lucid_camera_dev
    depends_on:
      - discovery-server
    env_file:
      - .env
    environment:
      - CAMERA_1_SERIAL=${CAMERA_1_SERIAL:-}
      - CAMERA_2_SERIAL=${CAMERA_2_SERIAL:-}
      - ROS_DISCOVERY_SERVER=${ROS_DISCOVERY_SERVER:-100.107.134.30:11811}
      - ROS_SUPER_CLIENT=${ROS_SUPER_CLIENT:-true}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/arena_camera_ros2/config/fastdds_publisher.xml
    volumes:
      - ./ros2_ws/src:/arena_camera_ros2/ros2_ws/src
      - ./config:/arena_camera_ros2/config
      - ./bags:/arena_camera_ros2/bags
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./scripts:/arena_camera_ros2/scripts
    network_mode: "host"
    privileged: true
    ipc: host
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: >
      bash -lc "/arena_camera_ros2/scripts/setup_routes.sh; source /opt/ros/humble/setup.bash &&
      colcon build --symlink-install &&
      source /arena_camera_ros2/ros2_ws/install/setup.bash &&
      ros2 launch arena_camera_node camera_pipeline.launch.py
      config_file:=/arena_camera_ros2/ros2_ws/src/arena_camera_node/config/cameras.yaml"
