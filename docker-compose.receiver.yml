# Docker Compose para Receptor de Stream
# Use este arquivo no PC que vai RECEBER o stream (sem câmera)

services:
  receiver:
    build:
      context: .
      dockerfile: Dockerfile.receiver
    container_name: lucid_receiver
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=42
      - ROS_LOCALHOST_ONLY=0
    network_mode: host
    ipc: host
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./notebook_setup:/lucid_receiver/notebook_setup:ro
    stdin_open: true
    tty: true
    command: bash
