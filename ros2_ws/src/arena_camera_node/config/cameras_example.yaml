# Exemplo de cameras.yaml — copie para cameras.yaml e ajuste.
#
# Este é o ARQUIVO ÚNICO de setup das câmeras: nome, serial, ip, interface
# ethernet, tópico, exposição/fps e resize+compressão, tudo por câmera.
# Para descobrir seriais e IPs: python3 /arena_camera_ros2/scripts/list_cameras.py
#
# Campos opcionais:
# - ip/iface: se presentes, scripts/setup_routes.sh cria rota /32 no boot
#   (necessário só com várias interfaces na mesma subnet 169.254.0.0/16)
# - resizer: se ausente ou enabled: false, publica só o raw
# - CAMERA_<NOME>_SERIAL no .env, se definido, tem precedência sobre o serial

cameras:
  # Exemplo completo: todos os campos
  - name: camera_1
    serial: "000000000"
    ip: 169.254.0.10
    iface: enx000000000000
    topic: /camera_1/image_raw
    pixelformat: rgb8
    exposure_auto: true
    exposure_time: 20000.0
    gain: 0.0
    frame_rate: 5.0
    frame_id: camera_1_optical_frame
    qos_reliability: reliable
    trigger_mode: false

    resizer:
      enabled: true
      name: camera_1_resizer
      output_topic: /camera_1/image_new
      output_width: 960
      output_height: 540
      interpolation: area
      qos_reliability: best_effort
      compression:
        format: jpeg
        jpeg_quality: 80
        jpeg_compress_bayer: false
        png_level: 3

  # Exemplo mínimo: só raw, sem rota dedicada
  - name: camera_2
    serial: "000000001"
    topic: /camera_2/image_raw
    pixelformat: rgb8
    qos_reliability: reliable
